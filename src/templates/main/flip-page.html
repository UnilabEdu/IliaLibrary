<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{{ book.title }}</title>
    <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/global.css') }}"
    />
    <script src="https://cdn.jsdelivr.net/npm/page-flip@latest/dist/js/page-flip.browser.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
</head>
<body class="flip-body-container" id="body">
<header class="flip-page-header" id="flip-page-header">
    <div class="flip-page-header-container container">
        
        <a href="{{ url_for('main.view_book',id=book.id) }}">
            <img src="{{ url_for('static', filename='assets/back.svg') }}" alt="გადადით უკან"/>
        </a>

        <div class="small-screen-back">
            <a href="{{ url_for('main.view_book',id=book.id) }}">
                <img src="{{ url_for('static', filename='assets/back.svg') }}" alt="გადადით უკან" />
            </a>
            <div >
                <p id="main-chapter-small-screen">{{book}} - </p>
            </div>
        </div>
        <div id="flip-pages">
            <div class="container page">
                <img src="{{ url_for('static', filename='assets/arrow-left.svg') }}" id="prev" alt="მარცხნივ გადასვლა"
                     style="cursor: pointer"/>
                <input type="text" class="current-page" 
                    style="width: 40px; text-align: center"            />
                <p>/</p>
                <p class="total-pages" id="total-pages"></p>
                <img src="{{ url_for('static', filename='assets/arrow-right.svg') }}" id="next" alt="მარჯვნივ გადასვლა"
                     style="cursor: pointer"/>

                <div class="zoom-container">
                    <button id="zoom_out">
                        <img src="{{ url_for('static', filename='assets/zoom_out.svg') }}" alt="zoom_out"/>
                    </button>
                    <div id="zoom-icon-container">
                        <svg width="26" height="27" viewBox="0 0 26 27" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M10.9995 1.25C16.2566 1.25 20.5962 5.68369 20.5962 11.25C20.5962 16.8163 16.2566 21.25 10.9995 21.25C5.74258 21.2497 1.40381 16.8162 1.40381 11.25C1.40381 5.68385 5.74258 1.25025 10.9995 1.25Z"
                                fill="white" fill-opacity="0.1" stroke="white" stroke-width="2.5" />
                            <path
                                d="M23.3888 25.8999C23.8679 26.3969 24.6448 26.3969 25.1239 25.8999C25.6031 25.4029 25.6031 24.5971 25.1239 24.1001L23.3888 25.8999ZM18.2307 18.75L17.3631 19.6499L23.3888 25.8999L24.2564 25L25.1239 24.1001L19.0983 17.8501L18.2307 18.75Z"
                                fill="white" />
                            <path d="M1.37932 7.4317L1.36026 7.31729C0.851313 4.26217 3.10665 1.44129 6.19887 1.26537V1.26537" stroke="white"  transform="translate(4, 4)" 
                                stroke-width="1.5" stroke-linecap="round" />
                        </svg>    
                    </div>

                    <button id="zoom_in">
                        <img src="{{ url_for('static', filename='assets/zoom_in.svg') }}" alt="zoom_in"/>
                    </button>
                </div>
            </div>
        </div>

        <div class="flip-navbar-right">
            <div id="menu" style="cursor: pointer">
                <img src="{{ url_for('static', filename='assets/burger-menu.svg') }}" alt="ჩამონათვალი"/>
            </div>

            <a href="{{ url_for('static', filename='upload/' + book.book_file) }}" download=" {{ book.book_file }}"
               class="download_book">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 28.9375C19.6666 28.9375 19.3542 28.8858 19.0625 28.7825C18.7708 28.6792 18.5 28.5017 18.25 28.25L9.24999 19.25C8.74999 18.75 8.50999 18.1667 8.52999 17.5C8.54999 16.8333 8.78999 16.25 9.24999 15.75C9.74999 15.25 10.3442 14.99 11.0325 14.97C11.7208 14.95 12.3142 15.1892 12.8125 15.6875L17.5 20.375V2.50001C17.5 1.79167 17.74 1.19834 18.22 0.720009C18.7 0.241675 19.2933 0.00167529 20 8.62068e-06C20.7066 -0.00165805 21.3008 0.238342 21.7825 0.720009C22.2641 1.20168 22.5033 1.79501 22.5 2.50001V20.375L27.1875 15.6875C27.6875 15.1875 28.2816 14.9475 28.97 14.9675C29.6583 14.9875 30.2516 15.2483 30.75 15.75C31.2083 16.25 31.4483 16.8333 31.47 17.5C31.4916 18.1667 31.2516 18.75 30.75 19.25L21.75 28.25C21.5 28.5 21.2291 28.6775 20.9375 28.7825C20.6458 28.8875 20.3333 28.9392 20 28.9375ZM5 40C3.625 40 2.44833 39.5108 1.47 38.5325C0.491666 37.5542 0.00166667 36.3767 0 35V30C0 29.2917 0.24 28.6983 0.72 28.22C1.2 27.7417 1.79333 27.5017 2.5 27.5C3.20666 27.4983 3.80083 27.7383 4.2825 28.22C4.76416 28.7017 5.00333 29.295 5 30V35H35V30C35 29.2917 35.24 28.6983 35.72 28.22C36.2 27.7417 36.7933 27.5017 37.5 27.5C38.2066 27.4983 38.8008 27.7383 39.2825 28.22C39.7641 28.7017 40.0033 29.295 40 30V35C40 36.375 39.5108 37.5525 38.5325 38.5325C37.5541 39.5125 36.3766 40.0017 35 40H5Z"
                          fill="white"
                          fill-opacity="0.6"/>
                </svg>
            </a>
        </div>
    </div>
</header>

<main id="main" class="flip-page-main">
    <p class="main-chapter" id="main-chapter">დასაწყისი</p>
    <section id="main-content">
        <div id="pdf-container"></div>
    </section>

    <section class="mobile-flip-pages-container">
        <div id="mobile-flip-pages">
            <div>
            </div>
            <div class="container page">
                <img src="{{ url_for('static', filename='assets/arrow-left.svg') }}" id="prev-mobile"
                    alt="მარცხნივ გადასვლა" style="cursor: pointer" />
                <p id="current-page-mobile">0</p>
                <p>/</p>
                <p class="total-pages" id="total-pages-mobile"></p>
                <img src="{{ url_for('static', filename='assets/arrow-right.svg') }}" id="next-mobile"
                    alt="მარჯვნივ გადასვლა" style="cursor: pointer" />
    
            </div>
            <a href="{{ url_for('static', filename='upload/' + book.book_file) }}" download=" {{ book.book_file }}"
                class="download_book">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M20 28.9375C19.6666 28.9375 19.3542 28.8858 19.0625 28.7825C18.7708 28.6792 18.5 28.5017 18.25 28.25L9.24999 19.25C8.74999 18.75 8.50999 18.1667 8.52999 17.5C8.54999 16.8333 8.78999 16.25 9.24999 15.75C9.74999 15.25 10.3442 14.99 11.0325 14.97C11.7208 14.95 12.3142 15.1892 12.8125 15.6875L17.5 20.375V2.50001C17.5 1.79167 17.74 1.19834 18.22 0.720009C18.7 0.241675 19.2933 0.00167529 20 8.62068e-06C20.7066 -0.00165805 21.3008 0.238342 21.7825 0.720009C22.2641 1.20168 22.5033 1.79501 22.5 2.50001V20.375L27.1875 15.6875C27.6875 15.1875 28.2816 14.9475 28.97 14.9675C29.6583 14.9875 30.2516 15.2483 30.75 15.75C31.2083 16.25 31.4483 16.8333 31.47 17.5C31.4916 18.1667 31.2516 18.75 30.75 19.25L21.75 28.25C21.5 28.5 21.2291 28.6775 20.9375 28.7825C20.6458 28.8875 20.3333 28.9392 20 28.9375ZM5 40C3.625 40 2.44833 39.5108 1.47 38.5325C0.491666 37.5542 0.00166667 36.3767 0 35V30C0 29.2917 0.24 28.6983 0.72 28.22C1.2 27.7417 1.79333 27.5017 2.5 27.5C3.20666 27.4983 3.80083 27.7383 4.2825 28.22C4.76416 28.7017 5.00333 29.295 5 30V35H35V30C35 29.2917 35.24 28.6983 35.72 28.22C36.2 27.7417 36.7933 27.5017 37.5 27.5C38.2066 27.4983 38.8008 27.7383 39.2825 28.22C39.7641 28.7017 40.0033 29.295 40 30V35C40 36.375 39.5108 37.5525 38.5325 38.5325C37.5541 39.5125 36.3766 40.0017 35 40H5Z"
                        fill="white" fill-opacity="0.6" />
                </svg>
            </a>
        </div>
    </section>
</main>
{# Loading #}
<section id="loader">
    <img src="{{ url_for('static',filename='assets/Animation-1736632045640.gif') }}" alt="წიგნი"/>
    <h1>მიმდინარეობს წიგნის ჩატვირთვა<span class="dots"></span></h1>
    <a href="{{ url_for('main.index') }}">დაბრუნდით მთავარ გვერდზე</a>
</section>

<script>
    let bookTitle = "{{ book }}"
    let pageToChapter = {
        "0": 'დასაწყისი',
        {%- for content in book.book_content -%}
            "{{ content.page_number }}": "{{ content.name }}",
            {%- if not loop.last %}{% endif %}
        {%- endfor -%}
    };
    
    let indexToPage = {
        "0": 0,
        {%- for content in book.book_content -%}
            "{{ loop.index }}": {{ content.page_number }}{% if not loop.last %},{% endif %}
        {%- endfor -%}
    };
</script>

<script src="{{ url_for('static', filename='js/flip-page.js') }}"></script>
<script>
    if (typeof pdfjsLib !== "undefined") {
        const pdfPath =
            "{{ url_for('static', filename='upload/' + book.book_file) }}";
        initializeViewer(pdfPath);
    } else {
        console.error("PDF.js is not available");
    }
</script>
</body>
</html>
