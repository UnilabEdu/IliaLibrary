<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description"
        content="ილია სახელმწიფო უნივერსიტეტის ბიბლიოთეკის ციფრული არქივი - საქართველოს უმსხვილესი ონლაინ საცავი, რომელიც მოიცავს ციფრულ წიგნებს, იშვიათ ხელნაწერებს, პერიოდულ გამოცემებს, ისტორიულ დოკუმენტებს, აკადემიურ და სამეცნიერო რესურსებს. აღმოაჩინეთ საქართველოს მდიდარი კულტურული, ლიტერატურული, სამეცნიერო და საგანმანათლებლო მემკვიდრეობა თანამედროვე ციფრული ბიბლიოთეკის მეშვეობით. ხელმისაწვდომია უფასო ღია წვდომა სტუდენტებისთვის, მკვლევარებისთვის და საზოგადოებისთვის." />
    <meta name="keywords"
        content="ილია სახელმწიფო ბიბლიოთეკა, ილიას სახელმწიფო უნივერსიტეტის ბიბლიოთეკა, ონლაინ არქივი, ციფრული ბიბლიოთეკა, ქართული არქივები, აკადემიური რესურსები, ციფრული წიგნები, ხელნაწერები, ისტორიული დოკუმენტები, პერიოდიკა, კვლევითი მასალები, ღია წვდომა, კულტურული მემკვიდრეობა" />

    <title>{% block title %} {% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='assets/icon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}"/>
</head>

<body class="landing-page">
<header>
    <div class="container header_wrapper">
        <div class="header_components">
            <div class="logo">
                <a href="{{ url_for('main.index') }}">
                    <img src="{{ url_for('static', filename='assets/logo.svg') }}" alt="logo"/>
                </a>
            </div>

            {% include "layouts/navbar.html" %}

            <div class="burger_menu">
                <div class="burger_menu_dropdown">
                    <nav>
                        <ul>
                            <li>
                                <a href="{{ url_for('main.index') }}"
                                    class="{% if request.endpoint == 'main.index' %}active-header{% endif %}">
                                    მთავარი
                                </a>
                            </li>
                            <li>
                                <a href="{{ url_for('main.about') }}"
                                    class="{% if request.endpoint == 'main.about' %}active-header{% endif %}">
                                    პროექტის შესახებ
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
        </div>
    </div>
</header>

{% block content %}
{% endblock %}

{% include "layouts/footer.html" %}
{% block script %}
{% endblock %}
</body>
</html>
